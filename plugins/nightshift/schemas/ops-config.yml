# Ops Config Schema — $OPS/config.yml (the operator's home, NEVER committed)
# =========================================================================
#
# This file is the ANNOTATED SCHEMA / reference for the one hand-written file in
# the ops home. The real config.yml lives on the operator's machine alongside
# runbook.md, dashboard.html, digests/, evidence/ and logs/ — none of which are
# ever committed. `ns` and `bin/dashboard` both read it; src/lib/ops-config.ts is
# the tested reader and the authority on every default and refusal below.
#
# WHY IT IS NOT IN THE PACK. The pack (<repo>/.nightshift/) answers "how do you
# review THIS repo" and travels with the code. This file answers "which repos do
# I, the operator, review from THIS machine, and how wide" — a fact about a
# person and a laptop, not about a codebase. Committing it would leak local
# paths and make one operator's fleet everyone's.
# ---------------------------------------------------------------------------

repos:            # list[object], REQUIRED, non-empty. One entry per onboarded repo.
  - path:         # string, REQUIRED. Repo root. A leading ~ or ~/ is expanded;
                  #   a relative path resolves against THIS FILE's directory (not
                  #   the cwd `ns` happened to run from). "~user" is NOT expanded.
    lanes:        # list[string]. Lanes enabled for this repo: [security, design].
                  #   A lane absent from the list is not "not due" — it is not
                  #   part of this system's job and is skipped entirely.
                  #   The map spelling ({security: true}) is also accepted.
    enabled:      # bool, default TRUE. `false` opts the whole repo out.
    name:         # string, optional. Display name; defaults to the path basename.
                  #   Two repos may not resolve to the same name — evidence and
                  #   digests are stored per name, so one would overwrite the other.
                  #   This check is CASE-INSENSITIVE: "Foo" and "foo" collide too,
                  #   because the ops home lives on this machine's default
                  #   case-insensitive filesystem (APFS/HFS+), where
                  #   $OPS/evidence/Foo/ and $OPS/evidence/foo/ are the same
                  #   directory even though they satisfy the name pattern below
                  #   as distinct strings.
                  #   Must be a single safe token: /^[A-Za-z0-9][A-Za-z0-9._-]*$/.
                  #   No slashes, no "..", no leading dot, no spaces — the name
                  #   becomes a directory ($OPS/evidence/<name>/, which evidence
                  #   retention PRUNES) and a word in the "<repo> <lane>" pairs
                  #   `ns run --due` reads back. A checkout whose BASENAME breaks
                  #   the rule is refused too; give that entry an explicit name.

dashboard:        # object, optional.
  out:            # string, default "dashboard.html". A single filename, written
                  #   directly inside the ops home — NOT a path. bin/ns never
                  #   resolves this value; it concatenates it onto $OPS_HOME
                  #   verbatim and atomically overwrites the result on every
                  #   finalization. A ".." segment therefore walks out of the ops
                  #   home and silently clobbers a real file (an operator's
                  #   runbook.md), so it is refused. An absolute path does not
                  #   escape (concatenation is not path.resolve — "/etc/x" gives
                  #   "$OPS//etc/x") but is refused too: it would quietly write
                  #   somewhere other than where it plainly asks to. A subpath
                  #   ("reports/dashboard.html") stays contained and is still
                  #   refused, because bin/ns never creates intermediate
                  #   directories and the write would fail later with a shell
                  #   error no one would trace back to this file.
  open_after_run: # bool, default TRUE. `ns run --no-open` overrides it per run.

sentinel:         # object, optional. Read by due-detection today; A9 adds the
                  #   scheduler that acts on it. `ns run --due` is the manual form
                  #   of exactly the same predicate (src/lib/due.ts).
  enabled:        # bool, default FALSE.
  hour:           # int 0-23, default 7. The hour A9's sentinel wakes up.
  cooldown_days:  # int >= 0, default 2. A run this recent BLOCKS a new one —
                  #   it outranks even a fresh diff, or a working tree that stays
                  #   dirty would re-trigger on every single invocation.
  weekly_floor_days: # int >= 1, default 7. Nothing overdue and nothing changed
                  #   still earns a run this often: coverage freshness decays on a
                  #   quiet repo, and a lane that only ever fires on change reports
                  #   "all clear" for surfaces it has not looked at in months.

max_concurrent_reviewers:  # int >= 1, default 3. How many reviewer+refuter pairs
                  #   may be in flight at once. The launcher chunks the selected
                  #   surfaces by this number and the workflow iterates the chunks,
                  #   so this value IS the concurrency policy (A7/T11).
