name: loops-ci

on:
  pull_request:
    paths:
      - "plugins/loops/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/loops-ci.yml"
  push:
    branches: [main]
    paths:
      - "plugins/loops/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/loops-ci.yml"

permissions:
  contents: read

jobs:
  # typecheck + vitest + build, and assert the committed bin/*.mjs bundle is in
  # sync with src/ (the tool ships compiled and zero-install, so a stale bundle
  # is a CI failure).
  loops-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/loops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - name: loops bundle and wrapper smoke
        run: |
          set -euo pipefail
          test -x bin/loops.mjs
          bin/loops.mjs --version
          sh -n templates/env-check
          test -x templates/env-check
      - name: committed artifacts are in sync with src
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- bin || [ -n "$(git status --porcelain -- bin)" ]; then
            echo "::error::bin/ artifacts are stale — run 'npm run build' and commit the result"
            exit 1
          fi

  # The compose-config differential corpus: the same wrapper against the real
  # `docker compose config`. The loops-engine job also runs this file but skips
  # the corpus when compose is absent; this job asserts it actually ran
  # (LOOPS_REQUIRE_COMPOSE=1 turns a missing plugin into a failure).
  compose-differential:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/loops
    env:
      LOOPS_REQUIRE_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: compose version
        run: |
          set -euo pipefail
          docker compose version
          docker compose config --help | grep -- --no-env-resolution
      - name: install
        run: npm ci --no-audit --no-fund
      - name: differential corpus
        run: npx vitest run src/lib/compose-config.test.ts
